<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundialMap Posadas by Apex Tech</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --bg-dark: #0d0f12;
            --glass: rgba(26, 32, 44, 0.65);
            --blue: #3498db;
            --green: #2ecc71;
            --arg-blue: #74acdf;
            --text-light: #ecf0f1;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; 
            font-family: 'Roboto', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        /* --- SPLASH SCREEN (PANTALLA DE ENTRADA HYPE) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 18, 0.6); /* Fondo oscuro transparente */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-bg-anim {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(116, 172, 223, 0.2) 0%, rgba(13, 15, 18, 0) 70%);
            animation: pulse-bg 4s infinite alternate;
            z-index: -1;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 1; }
        }

        .splash-content {
            text-align: center;
            padding: 20px;
        }

        .hype-title {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--arg-blue), 0 0 40px var(--arg-blue);
            animation: text-pulse 2s infinite alternate;
        }

        @keyframes text-pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px var(--arg-blue); }
            100% { transform: scale(1.05); text-shadow: 0 0 30px var(--arg-blue), 0 0 50px var(--arg-blue); }
        }

        .splash-subtitle {
            font-size: 1.2rem;
            color: #b0c4de;
            margin-bottom: 30px;
        }

        .btn-enter {
            background: linear-gradient(45deg, var(--blue), var(--arg-blue));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(116, 172, 223, 0.4);
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .btn-enter:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(116, 172, 223, 0.6);
        }

        /* --- CONTADOR REGRESIVO ESTILIZADO --- */
        .countdown-container {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .header-countdown {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(116, 172, 223, 0.2); 
            transform: scale(0.9); /* Un poco más chico para el header */
        }
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(116, 172, 223, 0.08); 
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(116, 172, 223, 0.3);
            min-width: 50px;
            box-shadow: 0 0 10px rgba(116, 172, 223, 0.15); 
        }
        .time-box span:first-child {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--arg-blue); 
            text-shadow: 0 0 10px rgba(116, 172, 223, 0.6); 
            line-height: 1;
        }
        .time-box .label {
            font-size: 0.65rem;
            color: #b0c4de;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* --- UI DEL MAPA (HEADER Y FILTROS) --- */
        header { 
            position: fixed; top: 20px; left: 20px;
            background: var(--glass); backdrop-filter: blur(12px);
            color: white; padding: 1rem 1.5rem; border-radius: 15px;
            box-shadow: var(--shadow); z-index: 1001; 
            border: 1px solid var(--border);
            max-width: fit-content;
        }
        header h1 { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.4rem; }
        header p { margin: 4px 0 0 0; font-size: 0.85rem; color: #b0c4de; }
        
        .nav-filters {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--glass); backdrop-filter: blur(12px);
            padding: 10px 15px; border-radius: 30px; box-shadow: var(--shadow); 
            z-index: 1000; border: 1px solid var(--border);
            display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
            width: max-content; max-width: 90vw;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .nav-filters::-webkit-scrollbar { display: none; }
        
        .btn-filter { 
            padding: 8px 16px; border: 1px solid #3d4653; border-radius: 20px; 
            background-color: transparent; cursor: pointer; font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 0.85rem; color: #95a5a6; transition: all 0.2s ease;
            white-space: nowrap; display: inline-flex; align-items: center;
        }
        .btn-filter:hover { background-color: rgba(255,255,255,0.05); }
        .btn-filter.active { background-color: var(--green); color: white; border-color: var(--green); }
        .btn-contact { color: var(--blue); border-color: var(--blue); text-decoration: none; }
        .btn-contact:hover { background-color: rgba(52, 152, 219, 0.1); }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        .leaflet-bar { border: none !important; box-shadow: var(--shadow) !important; }
        .leaflet-bar a { background-color: var(--glass) !important; color: var(--text-light) !important; border-bottom: 1px solid var(--border) !important; backdrop-filter: blur(5px) !important; }
        .leaflet-popup-content-wrapper { background: rgba(13, 15, 18, 0.95); backdrop-filter: blur(8px); color: var(--text-light); border-radius: 12px; border: 1px solid var(--border); }
        .leaflet-popup-tip { background: rgba(13, 15, 18, 0.95); }
        
        /* --- ESTILOS DE POPUPS Y MARCADORES --- */
        .place-info { padding: 2px; }
        .place-info h3 { margin: 0 0 4px 0; font-family: 'Poppins', sans-serif; color: white; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
        .place-info .address { font-size: 11px; color: #7f8c8d; margin-bottom: 8px; }
        .place-info p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.4; color: #b0c4de; }
        .tag { 
            display: inline-block; background: rgba(46, 204, 113, 0.1); color: var(--green); 
            padding: 4px 8px; border-radius: 12px; font-size: 10px; font-family: 'Poppins', sans-serif;
            font-weight: 600; margin: 0 4px 4px 0; border: 1px solid rgba(46, 204, 113, 0.2);
        }
        .tag-loud { background: rgba(116, 172, 223, 0.15); color: var(--arg-blue); border-color: var(--arg-blue); }

        /* Marcador Normal */
        .map-marker {
            background-color: var(--bg-dark); border: 2px solid var(--blue);
            border-radius: 50%; text-align: center; line-height: 24px; font-size: 14px;
        }

        /* Marcador con Animación (Volumen Alto) */
        .marker-loud {
            background-color: var(--bg-dark); border: 2px solid var(--arg-blue);
            border-radius: 50%; text-align: center; line-height: 24px; font-size: 14px;
            box-shadow: 0 0 10px var(--arg-blue);
            animation: marker-pulse 1.5s infinite;
        }
        @keyframes marker-pulse {
            0% { box-shadow: 0 0 0 0 rgba(116, 172, 223, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(116, 172, 223, 0); }
            100% { box-shadow: 0 0 0 0 rgba(116, 172, 223, 0); }
        }

        /* Bandera Animada */
        .flag-anim {
            display: inline-block;
            animation: wave 1s infinite alternate ease-in-out;
            transform-origin: bottom right;
        }
        @keyframes wave {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* Sello Apex Tech */
        .powered-by {
            position: fixed; top: 20px; right: 20px; background: var(--glass); backdrop-filter: blur(12px);
            color: #95a5a6; padding: 10px 15px; border-radius: 12px; font-family: 'Poppins', sans-serif;
            font-size: 11px; text-decoration: none; z-index: 1000; border: 1px solid var(--border);
            text-align: right; box-shadow: var(--shadow); transition: all 0.3s ease;
        }
        .powered-by strong { color: white; font-size: 13px; letter-spacing: 0.5px; }
        .powered-by:hover { transform: translateY(-2px); border-color: var(--blue); }
        .legal-text { font-size: 8.5px; margin-top: 4px; color: #7f8c8d; font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO (SPLASH) -->
    <div id="splash-screen">
        <div class="splash-bg-anim"></div>
        <div class="splash-content">
            <h1 class="hype-title">¡LLEGÓ LA HORA!</h1>
            <p class="splash-subtitle">Buscá dónde alentar a la Selección en Posadas</p>
            
            <div class="countdown-container">
                <div class="time-box"><span class="cd-days">00</span><span class="label">DÍAS</span></div>
                <div class="time-box"><span class="cd-hours">00</span><span class="label">HS</span></div>
                <div class="time-box"><span class="cd-minutes">00</span><span class="label">MIN</span></div>
                <div class="time-box"><span class="cd-seconds">00</span><span class="label">SEG</span></div>
            </div>

            <button class="btn-enter" onclick="entrarAlMapa()">ENTRAR AL MAPA 🇦🇷</button>
        </div>
    </div>

    <!-- UI DEL MAPA -->
    <header>
        <h1>MundialMap</h1>
        <p>Dónde ver los partidos en Posadas</p>
        
        <!-- Contador Pequeño del Header -->
        <div class="countdown-container header-countdown">
            <div class="time-box"><span class="cd-days">00</span><span class="label">DÍAS</span></div>
            <div class="time-box"><span class="cd-hours">00</span><span class="label">HS</span></div>
            <div class="time-box"><span class="cd-minutes">00</span><span class="label">MIN</span></div>
            <div class="time-box"><span class="cd-seconds">00</span><span class="label">SEG</span></div>
        </div>
    </header>

    <a href="#" class="powered-by">
        ⚡ Powered by <strong>Apex Tech</strong>
        <div class="legal-text">© 2026 Interfaz protegida.<br>Registro DNDA en trámite.</div>
    </a>

    <div class="nav-filters">
        <button class="btn-filter active" data-cat="all">Todos</button>
        <button class="btn-filter" data-cat="pantalla">Pantalla Grande</button>
        <button class="btn-filter" data-cat="birra">Cerveza</button>
        <button class="btn-filter" data-cat="costa">Costanera</button>
        <button class="btn-filter" data-cat="centro">Centro</button>
        <a href="https://wa.me/549376XXXXXXX?text=Hola!%20Quiero%20sumar%20mi%20local%20al%20MundialMap" target="_blank" class="btn-filter btn-contact">
            💼 Sumar mi Local
        </a>
    </div>

    <div id="map"></div>

    <script>
        // Lógica para quitar la pantalla de inicio
        function entrarAlMapa() {
            document.getElementById('splash-screen').classList.add('hidden');
        }

        // Lógica del Contador Regresivo (Actualizado para el 11 de Junio)
        const countDownDate = new Date("Jun 11, 2026 12:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Actualizar ambos relojes (Splash y Header) a la vez
            document.querySelectorAll(".cd-days").forEach(el => el.innerHTML = days < 10 ? "0" + days : days);
            document.querySelectorAll(".cd-hours").forEach(el => el.innerHTML = hours < 10 ? "0" + hours : hours);
            document.querySelectorAll(".cd-minutes").forEach(el => el.innerHTML = minutes < 10 ? "0" + minutes : minutes);
            document.querySelectorAll(".cd-seconds").forEach(el => el.innerHTML = seconds < 10 ? "0" + seconds : seconds);

            if (distance < 0) {
                clearInterval(x);
                document.querySelectorAll(".countdown-container").forEach(el => {
                    el.innerHTML = "<div style='color:#74acdf; font-weight:900; font-size:1.1rem; text-shadow: 0 0 10px rgba(116,172,223,0.8); text-align:center;'>¡HOY JUEGA LA SCALONETA! 🇦🇷</div>";
                });
            }
        }, 1000);

        // Inicialización del Mapa
        const map = L.map('map', { zoomControl: false }).setView([-27.364, -55.892], 14);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        // Base de Datos de Locales (Se agregó la propiedad "volumenAlto" a algunos)
        const places = [
            {
                name: "Hotel Continental", address: "Bolívar 1879, Piso 12", coords: [-27.3653, -55.8953],
                desc: "Ideal para verlo tranqui desde arriba. Tienen buena pantalla y menú armado. Clave reservar antes.",
                categories: ["pantalla", "centro"], tags: ["Rooftop", "Pantalla gigante", "Reservas"], volumenAlto: false
            },
            {
                name: "Cachalote", address: "Av. Costanera (frente al río)", coords: [-27.3600, -55.8895],
                desc: "Mucha movida en la terraza. Clásico para estar al aire libre con buena birra y cantitos.",
                categories: ["birra", "costa"], tags: ["Terraza", "Artesanal", "Vista al río"], volumenAlto: true
            },
            {
                name: "Antares", address: "Av. Costanera (Obispo Kemerer)", coords: [-27.3592, -55.8885],
                desc: "El clásico de la costa. Si llegás temprano enganchás buen lugar en la terraza.",
                categories: ["birra", "costa"], tags: ["Terraza", "Pintas"], volumenAlto: false
            },
            {
                name: "Glück", address: "Coronel López 2002 (4to Tramo)", coords: [-27.3615, -55.8905],
                desc: "Se pone lindo. Mesas grandes para ir en grupo, buenas hamburguesas y pantalla. Volumen a tope.",
                categories: ["birra", "costa", "pantalla"], tags: ["4to Tramo", "Comida"], volumenAlto: true
            },
            {
                name: "Refugio Patagonia", address: "Alfonso de Arrechea 811", coords: [-27.3626, -55.8943],
                desc: "Explota siempre. Si vas a la bajada del cerro a ver el partido, es acá. Clima de cancha total.",
                categories: ["birra", "costa"], tags: ["Bajada del Cerro", "Promos"], volumenAlto: true
            },
            {
                name: "La Casona", address: "Junín 1931", coords: [-27.3685, -55.8970],
                desc: "Bien céntrico. Tiran el proyector adentro, safa bastante si hace frío o viento en la costa.",
                categories: ["pantalla", "centro", "birra"], tags: ["Proyector", "Adentro"], volumenAlto: false
            },
            {
                name: "El Brete", address: "Costanera y Av. Antártida Argentina", coords: [-27.3562, -55.9080],
                desc: "Pantalla de la Muni. Llevate el sillón, el mate y preparate para gritar con todo el mundo.",
                categories: ["pantalla", "costa"], tags: ["Al aire libre", "Gratis"], volumenAlto: true
            }
        ];

        let activeMarkers = [];

        function renderMap(filter) {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            places.forEach(p => {
                if (filter === 'all' || p.categories.includes(filter)) {
                    
                    // Lógica para etiquetas HTML normales
                    let tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
                    
                    // Si el volumen es alto, agregamos el título con bandera animada y un Tag especial
                    let nombreHtml = p.volumenAlto ? `${p.name} <span class="flag-anim">🇦🇷</span>` : p.name;
                    if(p.volumenAlto) {
                        tagsHtml += `<span class="tag tag-loud">🔊 Clima de Cancha</span>`;
                    }
                    
                    const html = `
                        <div class="place-info">
                            <h3>${nombreHtml}</h3>
                            <div class="address">${p.address}</div>
                            <p>${p.desc}</p>
                            <div>${tagsHtml}</div>
                        </div>
                    `;

                    // Selección del ícono en base a si tiene volumen alto
                    const iconStyle = p.volumenAlto ? 'marker-loud' : 'map-marker';
                    const icon = L.divIcon({
                        className: iconStyle,
                        html: '⚽',
                        iconSize: [28, 28],
                        iconAnchor: [14, 28],
                        popupAnchor: [0, -30]
                    });

                    const marker = L.marker(p.coords, {icon: icon})
                        .bindPopup(html)
                        .addTo(map);
                    
                    activeMarkers.push(marker);
                }
            });
        }

        renderMap('all');

        // Lógica de los filtros
        document.querySelectorAll('button.btn-filter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('button.btn-filter').forEach(b => b.classList.remove('active'));
                const target = e.target;
                target.classList.add('active');
                renderMap(target.dataset.cat);
            });
        });
    </script>
</body>
</html>
