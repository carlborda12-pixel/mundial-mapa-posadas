<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MundialMap Posadas by Apex Tech</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <meta property="og:title" content="MundialMap Posadas 🇦🇷">
    <meta property="og:description" content="Buscá dónde alentar a la Selección en Posadas. Pantallas gigantes, cerveza y el mejor clima de cancha. Powered by Apex Tech.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-dark: #090c10; 
            
            /* --- EFECTO CRISTAL APPLE (RUIDO FRACTAL SVG) --- */
            --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            --glass-color: rgba(22, 27, 34, 0.65);
            --glass-darker: rgba(9, 12, 16, 0.85);
            
            --glass-bg: var(--noise), linear-gradient(var(--glass-color), var(--glass-color));
            --glass-bg-dark: var(--noise), linear-gradient(var(--glass-darker), var(--glass-darker));

            --blue: #2980b9;
            --green: #27ae60;
            --arg-blue: #74acdf;
            --fire-red: #e74c3c;
            --text-light: #e6edf3;
            --text-muted: #8b949e;
            --shadow-premium: 0 12px 40px rgba(0,0,0,0.5);
            --border-glow: rgba(255, 255, 255, 0.08);
        }

        button, a { -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-dark); color: var(--text-light); overflow: hidden; touch-action: pan-x pan-y; }

        /* --- TICKER EN VIVO --- */
        .live-ticker {
            position: fixed; top: 0; left: 0; width: 100%; height: 32px;
            background: var(--glass-bg-dark);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 1005; display: flex; align-items: center; border-bottom: 1px solid rgba(231, 76, 60, 0.3);
            font-size: 0.8rem; color: #c9d1d9; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .ticker-label {
            background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; font-family: 'Poppins', sans-serif; font-weight: 700;
            padding: 0 12px; height: 100%; display: flex; align-items: center; z-index: 2;
            box-shadow: 2px 0 10px rgba(0,0,0,0.6); letter-spacing: 0.5px; white-space: nowrap; font-size: 0.75rem;
        }
        .live-dot { height: 6px; width: 6px; background-color: white; border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; margin-right: 6px; box-shadow: 0 0 6px white; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        .ticker-content { flex-grow: 1; overflow: hidden; white-space: nowrap; position: relative; height: 100%; display: flex; align-items: center;}
        .ticker-track { display: inline-flex; align-items: center; white-space: nowrap; animation: scroll-ticker 35s linear infinite; }
        .ticker-item { margin-right: 40px; display: inline-flex; align-items: center; gap: 6px;}
        .ticker-item strong { color: var(--green); font-weight: 600; }
        .event-hl { color: var(--text-muted); font-size: 0.7rem; margin-left: 4px; font-weight: 400;}
        @keyframes scroll-ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        .shake-screen { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--glass-bg-dark); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s; overflow: hidden;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; transform: scale(1.05); }
        .splash-bg-anim {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(116, 172, 223, 0.15) 0%, rgba(9, 12, 16, 0) 70%);
            animation: pulse-bg 5s infinite alternate ease-in-out; z-index: -2;
        }
        @keyframes pulse-bg { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.3); opacity: 0.8; } }
        .splash-content { text-align: center; padding: 20px; z-index: 10; width: 90%; display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .hype-title {
            font-family: 'Poppins', sans-serif; font-size: 3.2rem; font-weight: 900; margin: 0; color: white; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(116, 172, 223, 0.5), 0 0 30px rgba(116, 172, 223, 0.3); animation: text-pulse 2.5s infinite alternate; line-height: 1.1;
        }
        @keyframes text-pulse { 0% { text-shadow: 0 0 15px rgba(116, 172, 223, 0.5); } 100% { text-shadow: 0 0 25px rgba(116, 172, 223, 0.8); } }
        .splash-subtitle { font-size: 1.1rem; color: #8b949e; margin: 0; font-weight: 300; }
        .btn-enter {
            background: linear-gradient(135deg, var(--blue), #1e5a84); color: white; border: 1px solid rgba(116, 172, 223, 0.3);
            padding: 14px 40px; font-size: 1.1rem; font-family: 'Poppins', sans-serif; font-weight: 600; border-radius: 40px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(41, 128, 185, 0.3); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); margin-top: 20px; width: 100%; max-width: 280px;
        }
        .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(41, 128, 185, 0.5); border-color: rgba(116, 172, 223, 0.6); }

        /* --- CONTADORES --- */
        .countdown-container { display: flex; gap: 10px; justify-content: center; margin: 15px 0;}
        .time-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(22, 27, 34, 0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-glow); min-width: 48px;
        }
        .time-box span:first-child { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 600; color: var(--arg-blue); line-height: 1; }
        .time-box .label { font-size: 0.6rem; color: var(--text-muted); font-weight: 600; margin-top: 4px; text-transform: uppercase; }

        /* --- CABECERA MAPA --- */
        header { 
            position: fixed; top: 45px; left: 15px; 
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            color: white; padding: 0.8rem 1.2rem; border-radius: 16px; box-shadow: var(--shadow-premium); z-index: 1001; border: 1px solid var(--border-glow);
            max-width: calc(100vw - 110px); transition: transform 0.3s ease;
        }
        header h1 { margin: 0; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; line-height: 1.2;}
        header p { margin: 2px 0 0 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 300; }
        .header-countdown { margin: 8px 0 0 0; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); transform: scale(0.85); transform-origin: left; }
        
        .btn-gol {
            position: fixed; top: 45px; right: 15px; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 10px 16px;
            font-size: 0.95rem; font-family: 'Poppins', sans-serif; font-weight: 700; border-radius: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            z-index: 1002; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px;
        }
        .btn-gol:active { transform: scale(0.95); }

        .powered-by {
            position: fixed; bottom: 85px; right: 15px; 
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            color: var(--text-muted); padding: 8px 14px; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 0.7rem; text-decoration: none; z-index: 1000; border: 1px solid var(--border-glow); box-shadow: var(--shadow-premium);
        }
        .powered-by strong { color: white; font-size: 0.75rem; font-weight: 600; }

        /* --- FILTROS --- */
        .nav-filters {
            position: fixed; bottom: 20px; left: 15px; width: calc(100% - 30px); 
            background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 8px; border-radius: 20px; box-shadow: var(--shadow-premium); z-index: 1000; border: 1px solid var(--border-glow);
            display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; box-sizing: border-box;
        }
        .nav-filters::-webkit-scrollbar { display: none; }
        .btn-filter { 
            padding: 8px 14px; border: 1px solid transparent; border-radius: 14px; background-color: rgba(255,255,255,0.03); cursor: pointer; font-family: 'Roboto', sans-serif; font-weight: 500; font-size: 0.8rem; color: #c9d1d9; white-space: nowrap; flex-shrink: 0; display: flex; gap: 4px;
        }
        .btn-filter.active { background-color: var(--blue); color: white; font-weight: 600; border-color: rgba(255,255,255,0.1); }
        .btn-contact { color: var(--arg-blue); border: 1px dashed rgba(116, 172, 223, 0.4); background: transparent; }

        /* --- MAPA Y MARCADORES --- */
        #map { flex-grow: 1; width: 100%; z-index: 1; }
        .leaflet-control-container .leaflet-top { top: 40px; }
        .leaflet-bar { border: none !important; box-shadow: var(--shadow-premium) !important; margin-top: 100px !important;}
        
        .map-marker { background-color: var(--bg-dark); border: 2px solid var(--blue); border-radius: 50%; text-align: center; line-height: 24px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .marker-loud { background-color: var(--bg-dark); border: 2px solid var(--arg-blue); border-radius: 50%; text-align: center; line-height: 24px; font-size: 14px; box-shadow: 0 0 12px rgba(116, 172, 223, 0.6); animation: marker-pulse 2s infinite; }
        
        .marker-hot { background-color: #900000; border: 2px solid var(--fire-red); border-radius: 50%; text-align: center; line-height: 24px; font-size: 14px; box-shadow: 0 0 15px var(--fire-red); animation: fire-pulse 0.8s infinite alternate; z-index: 1000 !important;}
        @keyframes fire-pulse { 0% { transform: scale(1); box-shadow: 0 0 10px var(--fire-red); } 100% { transform: scale(1.15); box-shadow: 0 0 25px #ff7979; border-color: #ff7979;} }
        @keyframes marker-pulse { 0% { box-shadow: 0 0 0 0 rgba(116, 172, 223, 0.8); } 100% { box-shadow: 0 0 0 20px rgba(116, 172, 223, 0); } }

        /* --- BOTTOM SHEET --- */
        #bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; 
            background: var(--glass-bg-dark);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            z-index: 1010; transition: bottom 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 24px 20px 40px; box-sizing: border-box; border-top: 1px solid var(--border-glow);
            display: flex; flex-direction: column; gap: 12px;
        }
        #bottom-sheet.open { bottom: 0; }
        .sheet-handle { width: 40px; height: 4px; background-color: rgba(255,255,255,0.3); border-radius: 4px; margin: -10px auto 15px; }
        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .sheet-title { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: white; margin: 0; display: flex; align-items: center; gap: 8px;}
        .sheet-close { background: rgba(255,255,255,0.1); border: none; color: #8b949e; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .sheet-address { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: -5px; }
        .sheet-desc { font-size: 0.95rem; color: var(--text-light); line-height: 1.5; font-weight: 300; margin: 5px 0;}
        .sheet-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        
        .tag { display: inline-block; background: rgba(41, 128, 185, 0.1); color: var(--arg-blue); padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; font-family: 'Poppins', sans-serif; font-weight: 500; border: 1px solid rgba(41, 128, 185, 0.3); }
        .tag-loud { background: rgba(116, 172, 223, 0.15); border-color: rgba(116, 172, 223, 0.5); font-weight: 600; }
        .tag-promo { background: rgba(231, 76, 60, 0.15); border-color: rgba(231, 76, 60, 0.5); color: #e74c3c; font-weight: 700; animation: pulse-promo 1.5s infinite;}
        
        @keyframes pulse-promo { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } }

        /* --- BOTONES DEL PANEL --- */
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        
        .btn-alentar {
            flex: 2; background: linear-gradient(135deg, #e67e22, #d35400); color: white; border: none; padding: 14px; border-radius: 14px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.4); transition: transform 0.2s, background 0.3s;
        }
        .btn-alentar:active { transform: scale(0.95); }
        .btn-alentar.confirmado { background: linear-gradient(135deg, #27ae60, #2ecc71); box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); pointer-events: none;}

        /* BOTÓN DE COMPARTIR */
        .btn-share {
            flex: 1; background: rgba(255,255,255,0.05); color: var(--arg-blue); border: 1px solid rgba(116, 172, 223, 0.3); padding: 14px; border-radius: 14px;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-share:hover { background: rgba(116, 172, 223, 0.1); border-color: rgba(116, 172, 223, 0.6); }
        .btn-share:active { transform: scale(0.95); }

        .flag-anim { display: inline-block; animation: wave 1.2s infinite alternate ease-in-out; transform-origin: bottom right; }
        @keyframes wave { 0% { transform: rotate(-10deg); } 100% { transform: rotate(15deg); } }

        #sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1009; opacity: 0; visibility: hidden; transition: all 0.4s ease;
        }
        #sheet-overlay.active { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <div id="splash-screen">

        <div class="splash-content">

    <header id="main-header">
        <h1>MundialMap</h1>
        <p>Dónde ver el partido</p>
        <div class="countdown-container header-countdown">
            <div class="time-box"><span class="cd-days">00</span><span class="label">DÍAS</span></div>
            <div class="time-box"><span class="cd-hours">00</span><span class="label">HS</span></div>
            <div class="time-box"><span class="cd-minutes">00</span><span class="label">MIN</span></div>
            <div class="time-box"><span class="cd-seconds">00</span><span class="label">SEG</span></div>
        </div>
    </header>

    <button class="btn-gol" onclick="explotarGol()">⚽ GOL</button>

    <a href="https://www.instagram.com/apex_sec/" target="_blank" rel="noopener noreferrer" class="powered-by">
        ⚡ by <strong>Apex Tech</strong>
    </a>

    <div class="nav-filters" id="nav-filters">
        <button class="btn-filter active" data-cat="all">🌏 Todos</button>
        <button class="btn-filter" data-cat="pantalla">📺 Pantallas</button>
        <button class="btn-filter" data-cat="birra">🍻 Cerveza</button>
        <button class="btn-filter" data-cat="costa">🌊 Costa</button>
        <button class="btn-filter" data-cat="centro">🏙️ Centro</button>
        <a href="https://wa.me/549376XXXXXXX" target="_blank" class="btn-filter btn-contact">💼 Sumar Local</a>
    </div>

    <div id="map"></div>

    <div id="sheet-overlay" onclick="cerrarPanel()"></div>
    <div id="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h2 class="sheet-title" id="sheet-title">Nombre</h2>
            <button class="sheet-close" onclick="cerrarPanel()">×</button>
        </div>
        <div class="sheet-address">📍 <span id="sheet-address">Dirección</span></div>
        <p class="sheet-desc" id="sheet-desc">Descripción</p>
        <div class="sheet-tags" id="sheet-tags"></div>
        
        <div class="btn-group">
            <button id="btn-alentar" class="btn-alentar" onclick="sumarHinchada()">Voy a alentar acá 🙋‍♂️</button>
            <button id="btn-share" class="btn-share" onclick="compartirLocal()">📲 Invitar</button>
        </div>
    </div>

    <script>
        const partidosEnVivo = [
            { eq1: "ARG 🇦🇷", res: "2 - 0", eq2: "MEX 🇲🇽", detalle: "⚽ 12' Messi, ⚽ 55' Garnacho" },
            { eq1: "BRA 🇧🇷", res: "1 - 1", eq2: "FRA 🇫🇷", detalle: "⚽ 33' Mbappé, ⚽ 45+2' Vinicius" },
            { eq1: "ENG 🏴󠁧󠁢󠁥󠁮󠁧󠁿", res: "0 - 0", eq2: "ESP 🇪🇸", detalle: "Min 78'" }
        ];
        function cargarTicker() {
            const track = document.getElementById('ticker-track');
            let htmlHTML = '';
            const repetidos = [...partidosEnVivo, ...partidosEnVivo, ...partidosEnVivo];
            repetidos.forEach(p => htmlHTML += `<span class="ticker-item">${p.eq1} <strong>${p.res}</strong> ${p.eq2} <span class="event-hl">(${p.detalle})</span></span>`);
            track.innerHTML = htmlHTML;
        }
        cargarTicker();

        function entrarAlMapa() { document.getElementById('splash-screen').classList.add('hidden'); }
        function explotarGol() {
            document.body.classList.add('shake-screen');
            setTimeout(() => document.body.classList.remove('shake-screen'), 400);
            var end = Date.now() + 2500;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#ffffff', '#74acdf'], zIndex: 10000, gravity: 0.8 });
                confetti({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#ffffff', '#74acdf'], zIndex: 10000, gravity: 0.8 });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        const countDownDate = new Date("Jun 11, 2026 12:00:00").getTime();
        setInterval(function() {
            const distance = countDownDate - new Date().getTime();
            if (distance < 0) return;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.querySelectorAll(".cd-days").forEach(el => el.innerHTML = d < 10 ? "0"+d : d);
            document.querySelectorAll(".cd-hours").forEach(el => el.innerHTML = h < 10 ? "0"+h : h);
            document.querySelectorAll(".cd-minutes").forEach(el => el.innerHTML = m < 10 ? "0"+m : m);
            document.querySelectorAll(".cd-seconds").forEach(el => el.innerHTML = s < 10 ? "0"+s : s);
        }, 1000);

        const map = L.map('map', { zoomControl: false, tap: false }).setView([-27.364, -55.892], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© OS' }).addTo(map);

        let places = [
            { id: 1, name: "Hotel Continental", address: "Bolívar 1879, Piso 12", coords: [-27.3653, -55.8953], desc: "Ideal para verlo tranqui desde arriba. Pantalla y menú armado.", categories: ["pantalla", "centro"], tags: ["Rooftop", "Reservas"], volumenAlto: false, confirmados: 5, promoFlash: "" },
            { id: 2, name: "Cachalote", address: "Av. Costanera", coords: [-27.3600, -55.8895], desc: "Mucha movida en la terraza. Clásico para estar al aire libre.", categories: ["birra", "costa"], tags: ["Terraza", "Artesanal"], volumenAlto: true, confirmados: 12, promoFlash: "🔥 2x1 en Pintas si venís con la camiseta!" },
            { id: 3, name: "Antares", address: "Av. Costanera (Obispo Kemerer)", coords: [-27.3592, -55.8885], desc: "El clásico de la costa. Enganchás buen lugar temprano.", categories: ["birra", "costa"], tags: ["Terraza"], volumenAlto: false, confirmados: 8, promoFlash: "" },
            { id: 4, name: "Glück", address: "Coronel López 2002", coords: [-27.3615, -55.8905], desc: "Se pone lindo. Mesas grandes para ir en grupo.", categories: ["birra", "costa", "pantalla"], tags: ["Comida"], volumenAlto: true, confirmados: 19, promoFlash: "" }, 
            { id: 5, name: "Refugio Patagonia", address: "Alfonso de Arrechea 811", coords: [-27.3626, -55.8943], desc: "Explota siempre. Bajada del cerro a ver el partido.", categories: ["birra", "costa"], tags: ["Promos"], volumenAlto: true, confirmados: 25, promoFlash: "" }, 
            { id: 6, name: "Vitrage Resto", address: "Bolívar 1918", coords: [-27.3665, -55.8960], desc: "Punto oficial. Pantallas por todos lados y promos vigentes.", categories: ["pantalla", "centro"], tags: ["Punto Oficial"], volumenAlto: true, confirmados: 2, promoFlash: "" }
        ];

        let activeMarkers = [];
        let localSeleccionado = null; 

        function abrirPanel(id) {
            const lugar = places.find(p => p.id === id);
            if(!lugar) return;
            localSeleccionado = lugar;

            map.flyTo([lugar.coords[0] - 0.003, lugar.coords[1]], 16, { duration: 0.5 });

            let tituloHTML = lugar.name;
            let tagsHTML = lugar.tags.map(t => `<span class="tag">${t}</span>`).join('');
            
            if(lugar.volumenAlto) {
                tituloHTML += ` <span class="flag-anim">🇦🇷</span>`;
                tagsHTML += `<span class="tag tag-loud">🔊 Clima Cancha</span>`;
            }
            if(lugar.promoFlash !== "") {
                tagsHTML += `<span class="tag tag-promo">${lugar.promoFlash}</span>`;
            }

            document.getElementById('sheet-title').innerHTML = tituloHTML;
            document.getElementById('sheet-address').textContent = lugar.address;
            document.getElementById('sheet-desc').textContent = lugar.desc;
            document.getElementById('sheet-tags').innerHTML = tagsHTML;

            const btn = document.getElementById('btn-alentar');
            const votoPrevio = localStorage.getItem('voto_mundialmap_local_' + lugar.id);
            btn.style.background = "";
            btn.style.boxShadow = "";

            if(votoPrevio) {
                btn.classList.add('confirmado');
                btn.innerHTML = `¡Confirmado! Ya somos ${lugar.confirmados} 🔥`;
            } else {
                btn.classList.remove('confirmado');
                btn.innerHTML = `Voy a alentar acá (${lugar.confirmados} listos) 🙋‍♂️`;
            }

            document.getElementById('main-header').style.transform = 'translateY(-150%)';
            document.getElementById('nav-filters').style.transform = 'translateY(150%)';
            document.getElementById('sheet-overlay').classList.add('active');
            document.getElementById('bottom-sheet').classList.add('open');
        }

        function cerrarPanel() {
            document.getElementById('sheet-overlay').classList.remove('active');
            document.getElementById('bottom-sheet').classList.remove('open');
            document.getElementById('main-header').style.transform = 'translateY(0)';
            document.getElementById('nav-filters').style.transform = 'translateY(0)';
            localSeleccionado = null;
        }

        function sumarHinchada() {
            if(!localSeleccionado) return;
            
            const votoPrevio = localStorage.getItem('voto_mundialmap_local_' + localSeleccionado.id);
            const btn = document.getElementById('btn-alentar');
            
            if(votoPrevio) {
                btn.innerHTML = `⚠️ Ya confirmaste asistencia acá`;
                btn.style.background = "linear-gradient(135deg, #7f8c8d, #95a5a6)"; 
                btn.style.boxShadow = "none";
                setTimeout(() => {
                    btn.style.background = ""; 
                    btn.innerHTML = `¡Confirmado! Ya somos ${localSeleccionado.confirmados} 🔥`;
                }, 2000);
                return;
            }

            localSeleccionado.confirmados++; 
            localStorage.setItem('voto_mundialmap_local_' + localSeleccionado.id, 'true');
            
            btn.style.background = "";
            btn.classList.add('confirmado');
            btn.innerHTML = `¡Confirmado! Ya somos ${localSeleccionado.confirmados} 🔥`;
            
            const filtroActivo = document.querySelector('.btn-filter.active').dataset.cat;
            renderMap(filtroActivo);
        }

        // --- SISTEMA PARA COMPARTIR NATIVO ---
        async function compartirLocal() {
            if (!localSeleccionado) return;
            
            const shareData = {
                title: 'MundialMap Posadas 🇦🇷',
                text: `Che, la previa del partido es en ${localSeleccionado.name} (${localSeleccionado.address}). ¡Mirá dónde queda en el mapa y sumate a la banda! 🍻`,
                url: window.location.href
            };

            try {
                // Chequeamos si el navegador del celular soporta compartir nativo
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Si están en PC o en un navegador viejo, copiamos al portapapeles
                    alert(`Tu navegador no soporta el menú rápido.\nCopiá este link para invitar a la banda: ${window.location.href}`);
                }
            } catch (err) {
                console.log('Error al compartir:', err);
            }
        }

        function renderMap(filter) {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];
            
            places.forEach(p => {
                if (filter === 'all' || p.categories.includes(filter)) {
                    
                    let iconStyle = p.volumenAlto ? 'marker-loud' : 'map-marker';
                    let iconoFisico = '⚽';

                    if(p.promoFlash !== "") iconoFisico = '🔥';

                    if(p.confirmados >= 20) {
                        iconStyle = 'marker-hot';
                        iconoFisico = '💥';
                    }

                    const icon = L.divIcon({ className: iconStyle, html: iconoFisico, iconSize: [28, 28], iconAnchor: [14, 28] });

                    const marker = L.marker(p.coords, {icon: icon})
                                    .addTo(map)
                                    .on('click', () => abrirPanel(p.id));
                    
                    activeMarkers.push(marker);
                }
            });
        }
        renderMap('all');

        document.querySelectorAll('button.btn-filter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('button.btn-filter').forEach(b => b.classList.remove('active'));
                const target = e.target;
                target.classList.add('active');
                renderMap(target.dataset.cat);
            });
        });
    </script>
</body>

    </script>
